# KlipperScreen anneal menu configuration
#
# Add these entries to your ~/printer_data/config/KlipperScreen.conf
# to get touchscreen annealing controls.
#
# This provides basic start/pause/resume/cancel buttons and
# profile selection. For a full annealing dashboard panel,
# install with: ./install.sh --klipperscreen
#
# Temperatures show in the titlebar if you add:
#   [printer MyPrinter]
#   titlebar_items: annealer

[menu __main anneal]
name: Annealing
icon: heat-up

[menu __main anneal start_pps]
name: Start PPS-CF
icon: resume
method: printer.gcode.script
params: {"script":"ANNEAL_START PROFILE=pps_cf"}

[menu __main anneal start_pet]
name: Start PET-CF
icon: resume
method: printer.gcode.script
params: {"script":"ANNEAL_START PROFILE=pet_cf"}

[menu __main anneal start_dry]
name: Dry Nylon
icon: resume
method: printer.gcode.script
params: {"script":"ANNEAL_START PROFILE=dry_nylon"}

[menu __main anneal pause]
name: Pause
icon: pause
method: printer.gcode.script
params: {"script":"ANNEAL_PAUSE"}

[menu __main anneal resume]
name: Resume
icon: resume
method: printer.gcode.script
params: {"script":"ANNEAL_RESUME"}

[menu __main anneal cancel]
name: Cancel
icon: stop
method: printer.gcode.script
params: {"script":"ANNEAL_CANCEL"}

[menu __main anneal status]
name: Status
icon: info
method: printer.gcode.script
params: {"script":"ANNEAL_STATUS"}

[menu __main anneal profiles]
name: List Profiles
icon: info
method: printer.gcode.script
params: {"script":"ANNEAL_PROFILES"}
