# KlipperScreen annealr menu configuration
#
# Add these entries to your ~/printer_data/config/KlipperScreen.conf
# to get touchscreen annealing controls.
#
# This provides basic start/pause/resume/cancel buttons and
# profile selection. For a full annealing dashboard panel,
# install with: ./install.sh --klipperscreen
#
# Temperatures show in the titlebar if you add:
#   [printer MyPrinter]
#   titlebar_items: airfryer

[menu __main annealr]
name: Annealing
icon: heat-up

[menu __main annealr start_pps]
name: Start PPS-CF
icon: resume
method: printer.gcode.script
params: {"script":"ANNEALR_START PROFILE=pps_cf"}

[menu __main annealr start_pet]
name: Start PET-CF
icon: resume
method: printer.gcode.script
params: {"script":"ANNEALR_START PROFILE=pet_cf"}

[menu __main annealr start_dry]
name: Dry Nylon
icon: resume
method: printer.gcode.script
params: {"script":"ANNEALR_START PROFILE=dry_nylon"}

[menu __main annealr pause]
name: Pause
icon: pause
method: printer.gcode.script
params: {"script":"ANNEALR_PAUSE"}

[menu __main annealr resume]
name: Resume
icon: resume
method: printer.gcode.script
params: {"script":"ANNEALR_RESUME"}

[menu __main annealr cancel]
name: Cancel
icon: stop
method: printer.gcode.script
params: {"script":"ANNEALR_CANCEL"}

[menu __main annealr status]
name: Status
icon: info
method: printer.gcode.script
params: {"script":"ANNEALR_STATUS"}

[menu __main annealr profiles]
name: List Profiles
icon: info
method: printer.gcode.script
params: {"script":"ANNEALR_PROFILES"}
