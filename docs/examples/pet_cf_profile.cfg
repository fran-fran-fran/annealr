# PET-CF stress relief annealing profile
#
# Simple ramp-soak-cool profile for PET-CF parts.
# Soak temperature slightly above Tg (~80°C).
#
# Estimated total time: ~2h depending on cooling rate.

[annealr_profile pet_cf]
description: PET-CF stress relief
segments:
    ramp,  85, rate=15
    soak,  60
    ramp,  45
