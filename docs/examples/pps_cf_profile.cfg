# PPS-CF crystallization annealing profile
#
# Multi-stage profile with controlled ramps through Tg and
# crystallization zones. Requires chamber capable of 200°C.
#
# Estimated total time: ~5h depending on cooling rate.

[annealr_profile pps_cf]
description: PPS-CF crystallization
segments:
    ramp,  80, rate=15
    soak,  30
    ramp, 130, rate=8
    soak,  45
    ramp, 200, rate=6
    soak, 120
    ramp, 120, rate=3
    ramp,  45
