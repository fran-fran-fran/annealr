# Generic filament drying profile
#
# Simple ramp to drying temperature and hold.
# Unconstrained ramp — chamber heats as fast as it can.
# Profile ends after soak (Mode A) — user removes filament when done.
#
# Adjust DURATION and TARGET for your specific filament:
#   PLA:    45°C,  4h (240 min)
#   PETG:   65°C,  4h (240 min)
#   ABS:    80°C,  4h (240 min)
#   Nylon:  80°C,  8h (480 min)
#   PPS:    90°C,  4h (240 min)
#
# Estimated total time: ramp (~5-10min) + soak duration.

[annealr_profile dry_nylon]
description: Nylon filament drying
segments:
    ramp, 80
    soak, 480
